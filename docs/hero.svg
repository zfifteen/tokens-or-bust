<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Tokens or Bust</title>
  <desc id="heroDesc">Twenty-one figures on whether installed silicon can still pay for the paper that bought it. Profit equals (P minus Cv) times V, minus F.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0f0c"/>
      <stop offset="0.55" stop-color="#10150f"/>
      <stop offset="1" stop-color="#1a2216"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ead9a8"/>
      <stop offset="1" stop-color="#c4a35a"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="38%" r="46%">
      <stop offset="0" stop-color="#c4a35a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0c0f0c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4a35a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c4a35a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c4a35a" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#glow)"/>

