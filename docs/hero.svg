    <rect x="1344" y="168" width="16" height="8" fill="#7cb389"/>
    <rect x="1344" y="196" width="16" height="8" fill="#d45d4a"/>
    <rect x="1392" y="128" width="18" height="9" fill="#c4a35a"/>
