  <text x="72" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="4.5" fill="#c4a35a">RESEARCH / UNWIND  ·  AS-OF 5 SEPTEMBER 2026</text>
  <text x="72" y="200" font-family="Georgia, Times New Roman, serif" font-size="92" font-weight="600" fill="#e8eadc">Tokens or Bust</text>
  <text x="72" y="268" font-family="Georgia, Times New Roman, serif" font-size="34" fill="#9aa186">The conversion-rate suite.</text>
  <text x="72" y="328" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="22" fill="#e8eadc">Twenty-one figures on whether installed silicon</text>
  <text x="72" y="360" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="22" fill="#e8eadc">can still pay for the paper that bought it.</text>

  <rect x="72" y="400" width="640" height="64" rx="10" fill="#161b14" stroke="#3a4030"/>
  <text x="392" y="442" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#e8eadc">Profit  =  (P  −  Cv)  ·  V  −  F</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="72" y="516" fill="#c4a35a">DANGER 3</text>
    <text x="186" y="516" fill="#6d7360">·</text>
    <text x="210" y="516" fill="#e8eadc">STRESSED</text>
    <text x="72" y="548" fill="#9aa186">H5 live on the cheap tier   ·   H4 failed as regime change</text>
    <text x="72" y="590" fill="#6d7360">Phone-first  ·  21 live charts  ·  Not a book</text>
  </g>
</svg>
