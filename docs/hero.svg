    <rect x="1392" y="192" width="18" height="9" fill="#7cb389"/>
    <rect x="1444" y="112" width="20" height="10" fill="#c4a35a"/>
    <rect x="1444" y="148" width="20" height="10" fill="#d45d4a"/>
    <rect x="1444" y="184" width="20" height="10" fill="#7cb389"/>
